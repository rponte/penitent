version: 2
updates:
  # one pull request a week per group, so each one runs the CI once
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # what builds the library: Maven, its wrapper and plugins
      build:
        patterns:
          - "org.apache.maven*"
          - "de.thetaphi:*"
      # what ends up in the published POMs, such as the Spring Boot BOM: only patch updates are
      # grouped; a minor or major update comes alone, since it may change behavior
      dependencies:
        patterns: ["*"]
        update-types: ["patch"]

  # the documentation site's tools, pinned in requirements-docs.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
