name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # compiled for Java 17, the minimum, and tested on it and on Java 21, with the ojdbc17 artifact of the driver;
    # then each other artifact of the same driver version on Java 21, and drivers 21 and 19 in each of their
    # artifacts (neither has ojdbc17), one axis at a time. Without jdbc-version, the driver is the Spring Boot BOM's
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '17']
        jdbc-artifact: ['ojdbc17']
        include:
          - java: '21'
            jdbc-artifact: 'ojdbc11'
          - java: '21'
            jdbc-artifact: 'ojdbc8'
          - java: '21'
            jdbc-artifact: 'ojdbc11'
            jdbc-version: '21.24.0.0'
          - java: '21'
            jdbc-artifact: 'ojdbc8'
            jdbc-version: '21.24.0.0'
          - java: '21'
            jdbc-artifact: 'ojdbc10'
            jdbc-version: '19.33.0.0'
          - java: '21'
            jdbc-artifact: 'ojdbc8'
            jdbc-version: '19.33.0.0'
    name: build (Java ${{ matrix.java }}, ${{ matrix.jdbc-artifact }}${{ matrix.jdbc-version && format(' {0}', matrix.jdbc-version) || '' }})
    runs-on: ubuntu-latest
    # the tests start their own Oracle through Testcontainers; most of the time is pulling its image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # the same command as on a developer's machine: the build pins its own locale and time zone
      - run: >-
          ./mvnw -B verify -Doracle.jdbc.artifact=${{ matrix.jdbc-artifact }}
          ${{ matrix.jdbc-version && format('-Doracle.jdbc.version={0}', matrix.jdbc-version) || '' }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}-${{ matrix.jdbc-artifact }}${{ matrix.jdbc-version && format('-{0}', matrix.jdbc-version) || '' }}
          path: '**/target/surefire-reports/'
          retention-days: 7
