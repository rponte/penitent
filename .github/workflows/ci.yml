name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # the baseline, and the oldest Java the library is meant to run on
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '17']
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    # the tests start their own Oracle through Testcontainers; most of the time is pulling its image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # the same command as on a developer's machine: the build pins its own locale and time zone
      - run: ./mvnw -B verify -Dmaven.compiler.release=${{ matrix.java }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/target/surefire-reports/'
          retention-days: 7
