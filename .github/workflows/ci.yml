name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # compiled for Java 17, the minimum, and tested on it and on Java 21, with the ojdbc17 artifact of the driver;
    # then each other artifact of the same driver version on Java 21, and drivers 21 and 19 in each of their
    # artifacts (neither has ojdbc17), one axis at a time. Without version, the driver is the Spring Boot BOM's.
    # Each of them against Oracle 23ai, the tests' default, against Oracle 21c and against Oracle 19c, which is
    # Oracle's Autonomous Database Free
    strategy:
      fail-fast: false
      matrix:
        database: ['23ai', '21c', '19c']
        driver:
          - { java: '21', artifact: 'ojdbc17' }
          - { java: '17', artifact: 'ojdbc17' }
          - { java: '21', artifact: 'ojdbc11' }
          - { java: '21', artifact: 'ojdbc8' }
          - { java: '21', artifact: 'ojdbc11', version: '21.24.0.0' }
          - { java: '21', artifact: 'ojdbc8', version: '21.24.0.0' }
          - { java: '21', artifact: 'ojdbc10', version: '19.33.0.0' }
          - { java: '21', artifact: 'ojdbc8', version: '19.33.0.0' }
        include:
          - database: '21c'
            image: 'gvenzl/oracle-xe:21-slim-faststart'
          - database: '19c'
            image: 'ghcr.io/oracle/adb-free:latest'
    # the jobs against 23ai keep the names they had before the database axis
    name: >-
      build (Java ${{ matrix.driver.java }}, ${{ matrix.driver.artifact }}${{ matrix.driver.version && format(' {0}', matrix.driver.version) || '' }}${{ matrix.image && format(', Oracle {0}', matrix.database) || '' }})
    runs-on: ubuntu-latest
    # the tests start their own Oracle through Testcontainers; most of the time is pulling its image, and 21c's and
    # 19c's are larger
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.driver.java }}
          cache: maven

      # the same command as on a developer's machine: the build pins its own locale and time zone
      - run: >-
          ./mvnw -B verify -Doracle.jdbc.artifact=${{ matrix.driver.artifact }}
          ${{ matrix.driver.version && format('-Doracle.jdbc.version={0}', matrix.driver.version) || '' }}
          ${{ matrix.image && format('-Doracle.database.image={0}', matrix.image) || '' }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.driver.java }}-${{ matrix.driver.artifact }}${{ matrix.driver.version && format('-{0}', matrix.driver.version) || '' }}-${{ matrix.database }}
          path: '**/target/surefire-reports/'
          retention-days: 7
