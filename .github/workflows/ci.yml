name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # the tests start their own Oracle through Testcontainers; most of the time is pulling its image
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # the same command as on a developer's machine: the build pins its own locale and time zone
      - run: ./mvnw -B verify

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
