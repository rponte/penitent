name: Documentation

# Every change builds the site, so a broken link or a missing page fails before a release. Only a release
# publishes it: after the Release workflow of a version tag succeeds, the site of that tag goes to GitHub Pages,
# so it always describes the latest version on Maven Central.
on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:   # from a tag: publishes that tag's site again

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  # a Release from a version tag that succeeded, not its dry run; or a manual run from a tag
  PUBLISH: >-
    ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
         && github.event.workflow_run.event == 'push')
        || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag') }}

jobs:
  build:
    # a Release that failed, or its dry run, has nothing to publish
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v7
        with:
          # after a Release, the commit of its tag; otherwise, the commit of the event
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # the Javadoc, then the site in strict mode, failing on a broken link or anchor
      - run: scripts/docs.sh build

      - if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
